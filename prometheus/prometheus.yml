global:
  scrape_interval: 5s       # lab: fast feedback. Production usually runs 15-30s.
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/active/*.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: [alertmanager:9093]

scrape_configs:
  - job_name: shop-api
    static_configs:
      - targets: [shop-api:8080]
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]
