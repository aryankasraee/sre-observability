# GENERATED by scripts/gen-slo-rules.py --profile prod --slo 0.995. Do not edit.
groups:
  - name: slo-recording
    rules:
      - record: slo:http_error_ratio:rate5m
        expr: (sum(rate(http_requests_total{code=~"5.."}[5m])) or vector(0)) / sum(rate(http_requests_total[5m]))
      - record: slo:http_error_ratio:rate30m
        expr: (sum(rate(http_requests_total{code=~"5.."}[30m])) or vector(0)) / sum(rate(http_requests_total[30m]))
      - record: slo:http_error_ratio:rate1h
        expr: (sum(rate(http_requests_total{code=~"5.."}[1h])) or vector(0)) / sum(rate(http_requests_total[1h]))
      - record: slo:http_error_ratio:rate2h
        expr: (sum(rate(http_requests_total{code=~"5.."}[2h])) or vector(0)) / sum(rate(http_requests_total[2h]))
      - record: slo:http_error_ratio:rate6h
        expr: (sum(rate(http_requests_total{code=~"5.."}[6h])) or vector(0)) / sum(rate(http_requests_total[6h]))
      - record: slo:http_error_ratio:rate1d
        expr: (sum(rate(http_requests_total{code=~"5.."}[1d])) or vector(0)) / sum(rate(http_requests_total[1d]))
      - record: slo:http_error_ratio:rate3d
        expr: (sum(rate(http_requests_total{code=~"5.."}[3d])) or vector(0)) / sum(rate(http_requests_total[3d]))
  - name: slo-alerts
    rules:
      - alert: SLOFastBurn
        expr: slo:http_error_ratio:rate1h > 0.072 and slo:http_error_ratio:rate5m > 0.072
        for: 2m
        labels:
          severity: page
          slo: availability
          service: shop-api
        annotations:
          summary: "Burning error budget at 14.4x or faster (1h and 5m windows): 2% of a 30-day budget gone in 1 hour"
          runbook_url: "https://github.com/aryankasraee/sre-observability/blob/HEAD/runbooks/slo-burn.md"
      - alert: SLOSlowBurn
        expr: slo:http_error_ratio:rate6h > 0.03 and slo:http_error_ratio:rate30m > 0.03
        for: 2m
        labels:
          severity: page
          slo: availability
          service: shop-api
        annotations:
          summary: "Burning error budget at 6x or faster (6h and 30m windows): 5% of a 30-day budget gone in 6 hours"
          runbook_url: "https://github.com/aryankasraee/sre-observability/blob/HEAD/runbooks/slo-burn.md"
      - alert: SLOBudgetBurnTicket
        expr: slo:http_error_ratio:rate1d > 0.015 and slo:http_error_ratio:rate2h > 0.015
        for: 2m
        labels:
          severity: ticket
          slo: availability
          service: shop-api
        annotations:
          summary: "Burning error budget at 3x or faster (1d and 2h windows): 10% of a 30-day budget gone in 1 day"
          runbook_url: "https://github.com/aryankasraee/sre-observability/blob/HEAD/runbooks/slo-burn.md"
      - alert: SLOBudgetLeak
        expr: slo:http_error_ratio:rate3d > 0.005 and slo:http_error_ratio:rate6h > 0.005
        for: 2m
        labels:
          severity: ticket
          slo: availability
          service: shop-api
        annotations:
          summary: "Burning error budget at 1x or faster (3d and 6h windows): budget on track to run out exactly at the end of the window"
          runbook_url: "https://github.com/aryankasraee/sre-observability/blob/HEAD/runbooks/slo-burn.md"
      - alert: HighLatencyP95
        expr: histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket[5m]))) > 0.5
        for: 2m
        labels:
          severity: ticket
          service: shop-api
        annotations:
          summary: "p95 latency above 500ms"
          runbook_url: "https://github.com/aryankasraee/sre-observability/blob/HEAD/runbooks/high-latency.md"
