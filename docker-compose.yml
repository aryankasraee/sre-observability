services:
  shop-api:
    build: ./app
    ports: ["127.0.0.1:18080:8080"]

  loadgen:
    image: python:3.13-slim
    command: ["python", "/loadgen.py"]
    volumes: ["./loadgen/loadgen.py:/loadgen.py:ro"]
    depends_on: [shop-api]

  prometheus:
    image: prom/prometheus:v3.15.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus/active:/etc/prometheus/active:ro
    ports: ["127.0.0.1:19090:9090"]
    depends_on: [shop-api, alertmanager]

  alertmanager:
    image: prom/alertmanager:v0.34.1
    volumes: ["./alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro"]
    ports: ["127.0.0.1:19093:9093"]

  loki:
    image: grafana/loki:3.7.8
    command: ["-config.file=/etc/loki/loki.yaml"]
    volumes: ["./loki.yaml:/etc/loki/loki.yaml:ro"]
    ports: ["127.0.0.1:13100:3100"]

  alloy:
    image: grafana/alloy:v1.20.1
    command: ["run", "--server.http.listen-addr=0.0.0.0:12345", "/etc/alloy/config.alloy"]
    user: root   # needs the Docker socket to read container logs
    volumes:
      - ./alloy.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on: [loki]

  grafana:
    image: grafana/grafana:13.2.3
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_SECURITY_ADMIN_PASSWORD: lab-admin   # lab only
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    ports: ["127.0.0.1:13000:3000"]
    depends_on: [prometheus, loki]
